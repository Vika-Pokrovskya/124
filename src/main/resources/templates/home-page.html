<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Домашняя страница</title>
    <!-- Подключаем Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Стиль для футера */
        footer {
            background-color: #f8f9fa;
            padding: 20px 0;
            margin-top: 40px;
            border-top: 1px solid #e9ecef;
            text-align: center;
        }
        .footer-content {
            max-width: 600px;
            margin: 0 auto;
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Работник</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Работник</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('MANAGER')">
                    <a class="nav-link" th:href="@{managers}">Менеджер</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{admins}">Директор</a>
                </li>
            </ul>
            <form class="d-flex" action="#" th:action="@{logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-danger">Выйти</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-5 flex-grow-1">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h2 class="card-title">Информация о Вас</h2>
        </div>
        <div class="card-body">
            <p class="card-text">
                <strong>Username:</strong> <span th:text="${username}"></span><br>
                <strong>Full Name:</strong> <span th:text="${fullName}"></span><br>
                <strong>Phone Number:</strong> <span th:text="${phoneNumber}"></span><br>
            </p>
            <button type="button" class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#editInfoModal">
                Изменить информацию
            </button>
        </div>
    </div>
    <div class="modal fade" id="editInfoModal" tabindex="-1" aria-labelledby="editInfoModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editInfoModalLabel">Редактирование информации</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <!-- Форма для редактирования информации -->
                    <form th:action="@{/updateUser}" method="post">
                        <div class="mb-3">
                            <label for="fullName" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="fullName" name="fullName" th:value="${fullName}" required>
                        </div>
                        <div class="mb-3">
                            <label for="phoneNumber" class="form-label">Phone Number</label>
                            <input type="text" class="form-control" id="phoneNumber" name="phoneNumber" th:value="${phoneNumber}" required>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
                            <button type="submit" class="btn btn-primary">Сохранить изменения</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-5">
        <ul class="nav nav-tabs" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="view-tasks-tab" data-bs-toggle="tab" data-bs-target="#view-tasks" type="button" role="tab" aria-controls="view-tasks" aria-selected="true">Просмотр задач</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="add-task-tab" data-bs-toggle="tab" data-bs-target="#add-task" type="button" role="tab" aria-controls="add-task" aria-selected="false">Добавить задачу</button>
            </li>
        </ul>
        <div class="tab-content" id="myTabContent">
            <div class="tab-pane fade show active" id="view-tasks" role="tabpanel" aria-labelledby="view-tasks-tab">
                <div class="card shadow mt-3">
                    <div class="card-header bg-primary text-white">
                        <h2 class="card-title">Задачи работника: <span th:text="${username}"></span></h2>
                    </div>
                    <div class="card-body">
                        <!-- Форма для выбора месяца -->
                        <form th:action="@{/}" method="get" class="mb-4">
                            <div class="mb-3">
                                <label for="monthId" class="form-label">Выберите месяц</label>
                                <select class="form-select" id="monthId" name="monthId" required>
                                    <option th:each="month : ${months}"
                                            th:value="${month.id}"
                                            th:text="${month.name}"
                                            th:selected="${month.id == selectedMonthId}">
                                    </option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary">Показать задачи</button>
                        </form>

                        <!-- Таблица с задачами -->
                        <table class="table table-bordered">
                            <thead>
                            <tr>
                                <th>№</th>  <!-- Добавляем заголовок для номера -->
                                <th>Месяц</th>
                                <th>Задание</th>
                                <th>Цена</th>
                                <th>Статус оплаты</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="task, iterStat : ${tasks}">
                                <td th:text="${iterStat.count}"></td>  <!-- Нумерация с 1 -->
                                <td th:text="${task.monthName}"></td>
                                <td th:text="${task.task}"></td>
                                <td th:text="${task.price}"></td>
                                <td th:text="${task.paymentStatus}"></td>
                            </tr>
                            </tbody>
                        </table>

                        <!-- Итоговые суммы -->
                        <div class="mt-3">
                            <h4>Сумма выполненных работ: <span th:text="${totalAmount}"></span></h4>
                            <h4>Оплачено: <span th:text="${paidAmount}"></span></h4>
                            <h4>Долг: <span th:text="${unpaidAmount}"></span></h4>
                        </div>
                    </div>
                </div>
            </div>
            <div class="tab-pane fade" id="add-task" role="tabpanel" aria-labelledby="add-task-tab">
                <div class="card shadow mt-3">
                    <div class="card-header bg-primary text-white">
                        <h2 class="card-title">Добавить задачу</h2>
                    </div>
                    <div class="card-body">
                        <!-- Форма для добавления новой задачи -->
                        <form th:action="@{/addTask}" method="post">
                            <!-- Скрытое поле для текущего месяца -->
                            <input type="hidden" name="monthId" th:value="${currentMonth}">

                            <div class="mb-3">
                                <label for="task" class="form-label">Задание</label>
                                <input type="text" class="form-control" id="task" name="task" required>
                            </div>

                            <button type="submit" class="btn btn-success">Добавить</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Футер -->
<footer class="mt-auto">
    <div class="footer-content">
        <p>&copy; 2025 Бочаров. Все права защищены.</p>

    </div>
</footer>

<!-- Подключаем Bootstrap JS (необязательно, но полезно для некоторых компонентов) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
