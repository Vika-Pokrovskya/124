
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Страница менеджера</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
  /* Стиль для футера */
        footer {
            background-color: #f8f9fa;
            padding: 20px 0;
            border-top: 1px solid #e9ecef;
            text-align: center;
        }
        .footer-content {
            max-width: 600px;
            margin: 0 auto;
        }

        /* Flexbox для прижатия футера к низу */
        html, body {
            height: 100%;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        .content {
            flex: 1;
        }
    </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Менеджер</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"sec:authorize="hasRole('USER')">
                    <a class="nav-link "  th:href="@{/}">Работник</a>
                </li>
                <li class="nav-item" >
                    <a class="nav-link active" aria-current="page" href="#">Менеджер</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{admins}">Директор</a>
                </li>
            </ul>
            <form class="d-flex" action="#" th:action="@{logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-danger">Выйти</button>
            </form>
        </div>
    </div>
</nav>

</body>
<!-- Футер -->
<footer class="mt-auto">
    <div class="footer-content">
        <p>&copy; 2025 Бочаров. Все права защищены.</p>

    </div>
</footer>
</html>
