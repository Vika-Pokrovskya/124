<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Страница администратора</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Подключаем Font Awesome для иконок -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        /* Стиль для футера */
        footer {
            background-color: #f8f9fa;
            padding: 20px 0;
            border-top: 1px solid #e9ecef;
            text-align: center;
        }
        .footer-content {
            max-width: 600px;
            margin: 0 auto;
        }

        /* Flexbox для прижатия футера к низу */
        html, body {
            height: 100%;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        .content {
            flex: 1;
        }

        /* Стили для иконки "глазика" */
        .eye-icon {
            cursor: pointer;
            color: #6c757d; /* Серый цвет по умолчанию */
            transition: color 0.3s ease;
        }
        .eye-icon:hover {
            color: #007bff; /* Синий цвет при наведении */
        }
    </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Директор</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item" sec:authorize="hasRole('USER')">
                    <a class="nav-link" th:href="@{/}">Работник</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('MANAGER')">
                    <a class="nav-link" th:href="@{managers}">Менеджер</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Директор</a>
                </li>
            </ul>
            <form class="d-flex" action="#" th:action="@{logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-danger">Выйти</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-5 content">
    <div class="card shadow">
        <div class="card-body">
            <h3>Список пользователей</h3>
            <table class="table table-bordered">
                <thead>
                <tr>
                    <th>User Name</th>
                    <th>Full Name</th>
                    <th>Phone Number</th>
                    <th>Роль</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="users_info : ${users_info}">
                    <td>
                        <span th:text="${users_info.userName}"></span>
                        <!-- Иконка "глазика" -->
                        <i class="fas fa-eye eye-icon"
                           th:attr="data-username=${users_info.userName}"
                           onclick="window.location.href='/admins/' + this.getAttribute('data-username')"></i>
                    </td>
                    <td th:text="${users_info.fullName}"></td>
                    <td th:text="${users_info.phoneNumber}"></td>
                    <td th:text="${users_info.role}"></td>
                    <td>
                        <!-- Кнопка для открытия модального окна редактирования -->
                        <button type="button" class="btn btn-warning btn-sm" data-bs-toggle="modal" data-bs-target="#editUserModal" th:attr="data-username=${users_info.userName}, data-fullname=${users_info.fullName}, data-phonenumber=${users_info.phoneNumber}">
                            Изменить
                        </button>
                        <!-- Новая кнопка для изменения ролей -->
                        <button type="button" class="btn btn-info btn-sm" data-bs-toggle="modal" data-bs-target="#editRolesModal"
                                th:attr="data-username=${users_info.userName}, data-role=${users_info.role}">
                            Изменить роли
                        </button>
                        <!-- Кнопка удаления пользователя -->
                        <form th:action="@{/admins/deleteUser}" method="post" style="display: inline;">
                            <input type="hidden" name="username" th:value="${users_info.userName}">
                            <button type="submit" class="btn btn-danger btn-sm">Удалить</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>

            <!-- Кнопка для открытия модального окна -->
            <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addUserModal">
                Добавить пользователя
            </button>

            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <!-- Модальное окно для добавления пользователя -->
            <div class="modal fade" id="addUserModal" tabindex="-1" aria-labelledby="addUserModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="addUserModalLabel">Добавить пользователя</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <!-- Форма для добавления пользователя -->
                            <form th:action="@{/admins/addUser}" method="post">
                                <div class="mb-3">
                                    <label for="username" class="form-label">Username</label>
                                    <input type="text" class="form-control" id="username" name="username" required>
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="password" name="password" required>
                                </div>
                                <div class="mb-3">
                                    <label for="fullName" class="form-label">Full Name</label>
                                    <input type="text" class="form-control" id="fullName" name="fullName" required>
                                </div>
                                <div class="mb-3">
                                    <label for="phoneNumber" class="form-label">Phone Number</label>
                                    <input type="text" class="form-control" id="phoneNumber" name="phoneNumber" required>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
                                    <button type="submit" class="btn btn-primary">Добавить</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно для редактирования пользователя -->
<div class="modal fade" id="editUserModal" tabindex="-1" aria-labelledby="editUserModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editUserModalLabel">Изменить пользователя</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <!-- Форма для редактирования пользователя -->
                <form th:action="@{/admins/updateUser}" method="post">
                    <input type="hidden" id="editUsername" name="username">
                    <div class="mb-3">
                        <label for="editFullName" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="editFullName" name="fullName" required>
                    </div>
                    <div class="mb-3">
                        <label for="editPhoneNumber" class="form-label">Phone Number</label>
                        <input type="text" class="form-control" id="editPhoneNumber" name="phoneNumber" required>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
                        <button type="submit" class="btn btn-primary">Сохранить изменения</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="editRolesModal" tabindex="-1" aria-labelledby="editRolesModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editRolesModalLabel">Изменить роли пользователя</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form th:action="@{/admins/updateUserRole}" method="post">
                    <input type="hidden" id="rolesUsername" name="username">
                    <div class="mb-3">
                        <label class="form-label">Выберите роли:</label>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="roleUser" name="roles" value="ROLE_USER">
                            <label class="form-check-label" for="roleUser">USER</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="roleManager" name="roles" value="ROLE_MANAGER">
                            <label class="form-check-label" for="roleManager">MANAGER</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="roleAdmin" name="roles" value="ROLE_ADMIN">
                            <label class="form-check-label" for="roleAdmin">ADMIN</label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
                        <button type="submit" class="btn btn-primary">Сохранить</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<!-- Подключаем Bootstrap JS (для работы модального окна) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Скрипт для заполнения модального окна данными -->
<script>
    document.getElementById('addUserModal').addEventListener('shown.bs.modal', function() {
    const form = this.querySelector('form');
    const usernameInput = form.querySelector('#username');

    form.addEventListener('submit', function(e) {
        if (!usernameInput.value.trim()) {
            e.preventDefault();
            alert('Имя пользователя не может быть пустым');
        }
    });

    // Проверка на существующего пользователя через AJAX
    usernameInput.addEventListener('blur', function() {
        if (this.value.trim()) {
            fetch('/api/checkUsername?username=' + encodeURIComponent(this.value))
                .then(response => response.json())
                .then(data => {
                    if (data.exists) {
                        alert('Пользователь с таким именем уже существует');
                    }
                });
        }
    });
});
    document.getElementById('editUserModal').addEventListener('show.bs.modal', function (event) {
        var button = event.relatedTarget; // Кнопка, которая открыла модальное окно
        var username = button.getAttribute('data-username');
        var fullName = button.getAttribute('data-fullname');
        var phoneNumber = button.getAttribute('data-phonenumber');

        // Заполняем форму данными
        document.getElementById('editUsername').value = username;
        document.getElementById('editFullName').value = fullName;
        document.getElementById('editPhoneNumber').value = phoneNumber;
    });
    // Обработчик для модального окна изменения ролей
document.getElementById('editRolesModal').addEventListener('show.bs.modal', function (event) {
    var button = event.relatedTarget;
    var username = button.getAttribute('data-username');
    var currentRoles = button.getAttribute('data-role'); // Получаем текущие роли

    // Заполняем имя пользователя
    document.getElementById('rolesUsername').value = username;

    // Сбрасываем все чекбоксы
    document.getElementById('roleUser').checked = false;
    document.getElementById('roleManager').checked = false;
    document.getElementById('roleAdmin').checked = false;

    // Устанавливаем чекбоксы в соответствии с текущими ролями
    if (currentRoles) {
        var rolesArray = currentRoles.split(',');
        rolesArray.forEach(function(role) {
            role = role.trim();
            if (role === 'ROLE_USER') document.getElementById('roleUser').checked = true;
            if (role === 'ROLE_MANAGER') document.getElementById('roleManager').checked = true;
            if (role === 'ROLE_ADMIN') document.getElementById('roleAdmin').checked = true;
        });
    }
});
</script>

<!-- Футер -->
<footer>
    <div class="footer-content">
        <p>&copy; 2025 Бочаров. Все права защищены.</p>
    </div>
</footer>
</body>
</html>
